# Manual settings merged over the discovery results by tools/build_targets.py.
# Keys given here replace the generated ones for that employer.
employers:
  - name: Jane Street
    # Internships are titled like full-time roles ("Quantitative Trader");
    # the description says whether the offer is an internship.
    platform: greenhouse
    params: {board: janestreet, internship_in_description: true}

  - name: BlackRock
    platform: workday
    params: {url: "https://blackrock.wd1.myworkdayjobs.com/BlackRock_Professional"}
    notes: careers.blackrock.com (Radancy) disallows /search-jobs in robots.txt, so the underlying Workday site is used.

  - name: Deutsche Börse / Eurex
    enabled: false
    notes: the only Workday site found belongs to ISS (a subsidiary), not to Deutsche Börse / Eurex; careers site is in-house.

  - name: CFM
    enabled: false
    notes: the Greenhouse board "cfm" belongs to another company; cfm.com publishes no machine-readable job list.

  - name: Nordea
    enabled: false
    notes: the Teamtailor site found is empty / not Nordea's main careers site; nordea.com careers is in-house.

  - name: BearingPoint
    notes: Teamtailor site covers BearingPoint Norway only.

  - name: Deloitte
    notes: apply.deloitte.com covers Deloitte US; Deloitte France has no machine-readable job list.

  - name: Amundi Luxembourg
    enabled: false
    notes: covered by the Amundi entry (jobs.amundi.com lists all Amundi entities, including Luxembourg).

  - name: Allianz GI
    enabled: false
    notes: covered by the Allianz entry (careers.allianz.com lists all Allianz companies, including Allianz Global Investors).

  - name: Bloomberg
    enabled: true
    platform: generic
    careers_url: https://bloomberg.avature.net/careers
    params: {urls: ["https://bloomberg.avature.net/careers/SearchJobs/?search={term}"], link_pattern: JobDetail}
    notes: Avature job list parsed; no internship open at discovery time.

  - name: Crédit Agricole Indosuez
    enabled: false
    notes: covered by the Groupe Crédit Agricole entry (groupecreditagricole.jobs lists all group entities).

  - name: Société Générale
    enabled: false
    notes: careers.societegenerale.com renders its search in JavaScript and exposes no public job endpoint (Taleo back-office is not public).

  - name: KPMG
    params: {base: "https://emplois.kpmg.fr", job_path: "/emploi/", default_country: FR}
    notes: KPMG France careers site.

  - name: Groupe Crédit Agricole
    params: {urls: ["https://groupecreditagricole.jobs/fr/nos-offres/?keyword={term}"], link_pattern: "/nos-offres-emploi/", default_country: FR}
    notes: groupecreditagricole.jobs lists all group entities (CA-CIB, Amundi, Indosuez, LCL...).

  - name: BCE (ECB)
    params: {urls: ["https://talent.ecb.europa.eu/careers/SearchJobs/?search={term}"], link_pattern: JobDetail, default_country: DE}

  - name: Amundi
    params: {urls: ["https://jobs.amundi.com/job/list-of-all-jobs.aspx?all=1&mode=list"], link_pattern: '/job/job-.*_\d+\.aspx', warmup_url: "https://jobs.amundi.com/accueil.aspx?LCID=2057"}

  - name: DNB
    enabled: false
    notes: the Lever board "dnb" belongs to Dun & Bradstreet, not to DNB bank; dnb.no careers is in-house.

  - name: Aon
    enabled: false
    notes: the Teamtailor site found is empty; jobs.aon.com has no machine-readable job list supported yet.

  - name: KfW
    enabled: false
    notes: jobs.kfw.de exposes no list of offers that can be read automatically.

  - name: Accenture
    # The shared Workday host (wd103) answers 429 to many requests: one search
    # term, no per-offer detail calls.
    params: {url: "https://accenture.wd103.myworkdayjobs.com/AccentureCareers", search_terms: [intern], details: false}

  - name: Vinci
    enabled: false
    notes: the Ashby board "vinci" belongs to an AI start-up, not to the Vinci group; jobs.vinci.com has no machine-readable job list supported yet.

  - name: LVMH
    notes: the Recruitee board covers only some LVMH companies (mostly retail roles in Germany).
