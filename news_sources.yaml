  - {bank: BCE, date: 2027-02-03, end: 2027-02-04}
  - {bank: BCE, date: 2027-03-17, end: 2027-03-18}
  - {bank: Fed, date: 2026-10-27, end: 2026-10-28}
  - {bank: Fed, date: 2026-12-08, end: 2026-12-09, note: "avec projections économiques (SEP)"}
