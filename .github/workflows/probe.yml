name: Probe news sources (temporary)
on:
  push:
    branches: [claude/internship-tracker]
    paths: [tools/probe.py, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m tools.probe
