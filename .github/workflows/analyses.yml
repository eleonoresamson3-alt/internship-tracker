name: Publish analyses

# The morning analyses are written by a scheduled Claude Code session, which pushes
# data/analyses.json to the claude/analyses branch. This copies the file to main
# (after checking it) and redeploys the site without scraping again.

on:
  push:
    branches: [claude/analyses]
    paths: [data/analyses.json]

# Read-only by default; the publish job asks for what it needs.
permissions:
  contents: read

concurrency:
  group: publish-analyses
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # copy data/analyses.json to main
      actions: write    # start the site-only deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - name: Copy and check the analyses
        id: copy
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          cp data/analyses.json /tmp/analyses-main.json
          git checkout "origin/${GITHUB_REF_NAME}" -- data/analyses.json
          python -m tracker.news.analyses --check
          # A push that only asks for fresh data (refresh_requested_at, see refresh.yml) has nothing
          # to publish: skip, so that the site-only deploy does not compete with the daily update.
          same=$(python3 -c "import json; a=json.load(open('/tmp/analyses-main.json')); b=json.load(open('data/analyses.json')); print(a.get('days') == b.get('days'))")
          if [ "$same" = "True" ]; then
            echo "Only a refresh request: nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            git checkout -- data/analyses.json
          fi
      - name: Commit to main
        if: steps.copy.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analyses.json
          git diff --cached --quiet && exit 0
          git commit -m "Analyses $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Redeploy the site
        if: steps.copy.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily.yml --ref main -f site_only=true
