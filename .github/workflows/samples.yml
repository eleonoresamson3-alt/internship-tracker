name: Fetch samples

# Development aid: saves the raw HTML of the URLs in tools/samples.txt.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools/samples.txt", "tools/fetch_samples.py"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/fetch_samples.py
      - name: Commit samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discovery/samples
          git diff --cached --quiet && exit 0
          git commit -m "Update HTML samples"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
