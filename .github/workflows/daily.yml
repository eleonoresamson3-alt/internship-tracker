name: Daily scrape

on:
  schedule:
    # 04:17 UTC: off the top of the hour, when GitHub delays or drops many scheduled runs,
    # and early enough for the morning analyses (07:41 Paris time).
    - cron: "17 4 * * *"
  push:
    # Editing the trainings list only needs the site to be rebuilt.
    branches: [main]
    paths: [config/formations.yaml]
  workflow_dispatch:
    inputs:
      site_only:
        description: "Only rebuild and deploy the site (used after the morning analyses are published)"
        type: boolean
        default: false

# Read-only by default; each job asks for what it needs.
permissions:
  contents: read

concurrency:
  group: daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit data/
      issues: write     # daily digest, see tracker/notify.py
    env:
      SITE_ONLY: ${{ inputs.site_only || github.event_name == 'push' }}
      GHA_NOTICES: notices.txt   # see tracker/gha.py and tools/ci/run-paused.sh
    timeout-minutes: 120
    steps:
      # Third-party actions are pinned to a full commit SHA (the tag is in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 30   # enough history to see today's data commit (step below)
      - name: Skip the scrape if today's update already ran
        id: already
        # The morning analyses start the update themselves (refresh.yml). GitHub often starts the
        # scheduled run hours late: it then only redeploys the site instead of scraping again.
        if: github.event_name == 'schedule'
        run: |
          if git log -1 --format=%s -- data/jobs.json | grep -q "Daily data update $(date -u +%Y-%m-%d)"; then
            echo "Today's data is already there: site only."
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - name: Unit tests
        if: env.SITE_ONLY != 'true' && steps.already.outputs.done != 'true'
        run: tools/ci/run-paused.sh python -m pytest -q
      - name: Scrape
        if: env.SITE_ONLY != 'true' && steps.already.outputs.done != 'true'
        run: tools/ci/run-paused.sh python -m tracker.run
      - name: News watch
        if: env.SITE_ONLY != 'true' && steps.already.outputs.done != 'true'
        # Separate step: a news or market-data problem must not block the internship tracker.
        continue-on-error: true
        env:
          WEBSTAT_API_KEY: ${{ secrets.WEBSTAT_API_KEY }}   # optional: French yields, see README
        run: tools/ci/run-paused.sh python -m tracker.news.run
      - name: News summary (optional, needs the ANTHROPIC_API_KEY secret)
        if: env.SITE_ONLY != 'true' && steps.already.outputs.done != 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: tools/ci/run-paused.sh python -m tracker.news.summary
      - name: Commit data
        if: env.SITE_ONLY != 'true' && steps.already.outputs.done != 'true'
        run: |
          exec > >(tee -a run.log) 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Daily data update $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Build site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          mkdir -p _site/data
          cp data/*.json _site/data/
          python -m tracker.formations _site/formations.json
          # Version the assets so browsers load the new site after each update.
          v="${GITHUB_SHA::7}"
          sed -i "s/style.css\"/style.css?v=${v}\"/; s/app.js\"/app.js?v=${v}\"/; s/formations.js\"/formations.js?v=${v}\"/" _site/index.html
      - name: Daily digest (e-mail through a GitHub issue comment)
        if: github.ref == 'refs/heads/main' && env.SITE_ONLY != 'true' && steps.already.outputs.done != 'true'
        continue-on-error: true   # a notification problem must not block the site update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m tracker.notify digest.md
          [ -s digest.md ] || exit 0
          num=$(gh issue list --label recap --state open --json number --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            gh label create recap --color 1f4fd1 --description "Daily internship digest" 2>/dev/null || true
            gh issue create --title "📬 Récapitulatif quotidien des stages" --label recap --body-file digest.md
          else
            gh issue comment "$num" --body-file digest.md
          fi
      - name: Report failure
        if: failure()
        # The log tail goes into one escaped annotation: it cannot start a new workflow command.
        run: |
          msg=$(tail -c 3000 run.log 2>/dev/null | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Failure log::${msg}"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      pages: write      # deploy to GitHub Pages
      id-token: write   # required by actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
