name: Daily scrape

on:
  schedule:
    - cron: "0 5 * * *"   # every day at 05:00 UTC
  workflow_dispatch:
  # Development branches: scrape on every change to the code or the targets,
  # so results can be checked before merging. Deployment only happens on main.
  push:
    branches: ["claude/**"]
    paths: ["tracker/**", "targets.yaml", "docs/**", ".github/workflows/daily.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Scrape
        run: python -m tracker.run
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Daily data update $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Build site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          mkdir -p _site/data
          cp data/*.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
