name: Daily scrape

on:
  schedule:
    - cron: "0 5 * * *"   # every day at 05:00 UTC
  push:
    # Editing the trainings list only needs the site to be rebuilt.
    branches: [main]
    paths: [config/formations.yaml]
  workflow_dispatch:
    inputs:
      site_only:
        description: "Only rebuild and deploy the site (used after the morning analyses are published)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write   # daily digest, see tracker/notify.py

concurrency:
  group: daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      SITE_ONLY: ${{ inputs.site_only || github.event_name == 'push' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        if: env.SITE_ONLY != 'true'
        run: python -m pytest -q 2>&1 | tee -a run.log; exit ${PIPESTATUS[0]}
      - name: Scrape
        if: env.SITE_ONLY != 'true'
        run: python -m tracker.run 2>&1 | tee -a run.log; exit ${PIPESTATUS[0]}
      - name: News watch
        if: env.SITE_ONLY != 'true'
        # Separate step: a news or market-data problem must not block the internship tracker.
        continue-on-error: true
        env:
          WEBSTAT_API_KEY: ${{ secrets.WEBSTAT_API_KEY }}   # optional: French yields, see README
        run: python -m tracker.news.run 2>&1 | tee -a run.log; exit ${PIPESTATUS[0]}
      - name: News summary (optional, needs the ANTHROPIC_API_KEY secret)
        if: env.SITE_ONLY != 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m tracker.news.summary 2>&1 | tee -a run.log; exit ${PIPESTATUS[0]}
      - name: Commit data
        if: env.SITE_ONLY != 'true'
        run: |
          exec > >(tee -a run.log) 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Daily data update $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Build site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          mkdir -p _site/data
          cp data/*.json _site/data/
          python -m tracker.formations _site/formations.json
          # Version the assets so browsers load the new site after each update.
          sed -i "s/style.css\"/style.css?v=${GITHUB_SHA::7}\"/; s/app.js\"/app.js?v=${GITHUB_SHA::7}\"/" _site/index.html
      - name: Daily digest (e-mail through a GitHub issue comment)
        if: github.ref == 'refs/heads/main' && env.SITE_ONLY != 'true'
        continue-on-error: true   # a notification problem must not block the site update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m tracker.notify digest.md
          [ -s digest.md ] || exit 0
          num=$(gh issue list --label recap --state open --json number --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            gh label create recap --color 1f4fd1 --description "Daily internship digest" 2>/dev/null || true
            gh issue create --title "📬 Récapitulatif quotidien des stages" --label recap --body-file digest.md
          else
            gh issue comment "$num" --body-file digest.md
          fi
      - name: Report failure
        if: failure()
        run: |
          msg=$(tail -c 3000 run.log 2>/dev/null | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Failure log::${msg}"
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
