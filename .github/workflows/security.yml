name: Dependency audit

# Known vulnerabilities in the pinned Python dependencies (pip-audit, PyPI advisory database).
on:
  push:
    branches: [main]
    paths: [requirements.txt, requirements.in]
  pull_request:
    branches: [main]
    paths: [requirements.txt, requirements.in]
  schedule:
    - cron: "41 4 * * 1"   # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install --quiet "pip-audit==2.9.0"
          /tmp/audit/bin/pip-audit --require-hashes --disable-pip -r requirements.txt
