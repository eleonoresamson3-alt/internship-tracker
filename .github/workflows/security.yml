name: Dependency audit

# Known vulnerabilities in the pinned Python dependencies (pip-audit, PyPI advisory database).
on:
  push:
    branches: [main]
    paths: [requirements.txt, requirements.in]
  pull_request:
    branches: [main]
    paths: [requirements.txt, requirements.in]
  schedule:
    - cron: "41 4 * * 1"   # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install --quiet "pip-audit==2.9.0"
          /tmp/audit/bin/pip-audit --require-hashes --disable-pip -r requirements.txt
