name: Discover platforms

# Helper used when adding employers: detects which recruitment platform each
# employer in tools/employers.yaml uses, and commits discovery/results.md.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Employer names, comma-separated (leave empty for all)"
        required: false

# Read-only by default; the job asks for what it needs.
permissions:
  contents: read

concurrency:
  group: discover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit discovery/
    env:
      GHA_NOTICES: notices.txt
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - name: Run discovery
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            tools/ci/run-paused.sh python tools/discover.py --only "$ONLY"
          else
            tools/ci/run-paused.sh python tools/discover.py
          fi
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discovery/
          git diff --cached --quiet && exit 0
          git commit -m "Update platform discovery results"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
